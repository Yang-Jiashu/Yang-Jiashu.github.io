<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">历史结论的适用条件</title><desc id="desc">目标机制示意。f由A变为B，使对应证据T_A待重验。其他历史记录仍保留但适用性需检查；未声明依赖保持未知。已声明关系并不是语义正确的证明。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#315e50" stroke-width="1.5"/></marker><marker id="changed" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#ac4937" stroke-width="1.5"/></marker></defs>
<rect width="800" height="340" fill="#fcfdfa"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="32" y="40" font-size="20" fill="#263c34" font-weight="600" text-anchor="start">历史结论的适用条件</text>
<text x="768" y="40" font-size="16" fill="#ac4937" font-weight="400" text-anchor="end">局部修改 f：A → B</text>
<text x="94" y="89" font-size="16" fill="#68766d" font-weight="400" text-anchor="middle">记录来源</text>
<text x="342" y="89" font-size="16" fill="#68766d" font-weight="400" text-anchor="middle">历史证据</text>
<text x="660" y="89" font-size="16" fill="#68766d" font-weight="400" text-anchor="middle">当前判断</text>
<text x="94" y="138" font-size="20" fill="#263c34" font-weight="400" text-anchor="middle">f@A</text>
<text x="342" y="138" font-size="20" fill="#263c34" font-weight="400" text-anchor="middle">T_A</text>
<text x="660" y="138" font-size="20" fill="#ac4937" font-weight="600" text-anchor="middle">待重验</text>
<path d="M154 131H282" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M402 131H566" fill="none" stroke="#ac4937" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#changed)"/>
<path d="M48 154L140 154" fill="none" stroke="#d7dfd8" stroke-width="1.5"/>
<path d="M296 154L388 154" fill="none" stroke="#d7dfd8" stroke-width="1.5"/>
<path d="M584 154L736 154" fill="none" stroke="#ac4937" stroke-width="1.5"/>
<text x="94" y="230" font-size="20" fill="#263c34" font-weight="400" text-anchor="middle">g@A</text>
<text x="342" y="230" font-size="20" fill="#263c34" font-weight="400" text-anchor="middle">U_A</text>
<text x="660" y="230" font-size="20" fill="#315e50" font-weight="600" text-anchor="middle">历史保留</text>
<path d="M154 223H282" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M402 223H566" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M48 246L140 246" fill="none" stroke="#d7dfd8" stroke-width="1.5"/>
<path d="M296 246L388 246" fill="none" stroke="#d7dfd8" stroke-width="1.5"/>
<path d="M584 246L736 246" fill="none" stroke="#315e50" stroke-width="1.5"/>
<text x="660" y="178" font-size="16" fill="#68766d" font-weight="400" text-anchor="middle">来源版本已变化</text>
<text x="660" y="270" font-size="16" fill="#68766d" font-weight="400" text-anchor="middle">适用性仍需检查</text>
<path d="M32 296L768 296" fill="none" stroke="#d7dfd8" stroke-width="1.5"/>
<text x="32" y="324" font-size="16" fill="#68766d" font-weight="400" text-anchor="start">未声明依赖 → 未知</text>
<text x="768" y="324" font-size="16" fill="#68766d" font-weight="400" text-anchor="end">已声明关系 ≠ 语义证明</text>
</g>
</svg>
