<svg xmlns="http://www.w3.org/2000/svg" width="360" height="530" viewBox="0 0 360 530" role="img" aria-labelledby="title desc">
<title id="title">运行时目标闭环</title><desc id="desc">目标机制。检查前提、按需准备、执行验证、提交状态构成循环。图描述受支持边界上的目标职责，失败与重试也记入成本。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#315e50" stroke-width="1.5"/></marker><marker id="changed" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#ac4937" stroke-width="1.5"/></marker></defs>
<rect width="360" height="530" fill="#fcfdfa"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="24" y="34" font-size="17" fill="#263c34" font-weight="600" text-anchor="start">运行时目标闭环</text>
<text x="174" y="96" font-size="17" fill="#263c34" font-weight="600" text-anchor="middle">检查前提</text>
<text x="174" y="125" font-size="14" fill="#68766d" font-weight="400" text-anchor="middle">版本 / 材料 / 预算</text>
<path d="M58 140L290 140" fill="none" stroke="#d7dfd8" stroke-width="1.5"/>
<text x="174" y="196" font-size="17" fill="#263c34" font-weight="600" text-anchor="middle">按需准备</text>
<text x="174" y="225" font-size="14" fill="#68766d" font-weight="400" text-anchor="middle">读取 / 恢复 / 重验</text>
<path d="M58 240L290 240" fill="none" stroke="#d7dfd8" stroke-width="1.5"/>
<text x="174" y="296" font-size="17" fill="#263c34" font-weight="600" text-anchor="middle">执行验证</text>
<text x="174" y="325" font-size="14" fill="#68766d" font-weight="400" text-anchor="middle">受支持的控制边界</text>
<path d="M58 340L290 340" fill="none" stroke="#d7dfd8" stroke-width="1.5"/>
<text x="174" y="396" font-size="17" fill="#263c34" font-weight="600" text-anchor="middle">提交状态</text>
<text x="174" y="425" font-size="14" fill="#68766d" font-weight="400" text-anchor="middle">结果 / 来源 / 成本</text>
<path d="M58 440L290 440" fill="none" stroke="#d7dfd8" stroke-width="1.5"/>
<path d="M174 145V168" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M174 245V268" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M174 345V368" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M290 414H326V111H290" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="174" y="475" font-size="14" fill="#315e50" font-weight="400" text-anchor="middle">提交后进入下一轮检查</text>
<text x="174" y="506" font-size="14" fill="#68766d" font-weight="400" text-anchor="middle">失败 / 重试同样记账</text>
</g>
</svg>
