<svg xmlns="http://www.w3.org/2000/svg" width="900" height="478" viewBox="0 0 900 478" role="img" aria-labelledby="title desc">
<title id="title">运行时目标闭环</title><desc id="desc">显式前提满足后执行；缺失、失效或未知先恢复重查，无法准备则停止。结果和所有已发生成本进入版本化状态。</desc>
<defs><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#315e50" stroke-width="1.3"/></marker><marker id="red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#ac4937" stroke-width="1.3"/></marker></defs>
<rect width="900" height="478" rx="8" fill="#f4f5ee"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><text x="28" y="34" font-size="16" fill="#677568" font-weight="400" text-anchor="start">目标闭环 / 先检查前提，再安排执行</text><path d="M184 143H259" fill="none" stroke="#315e50" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#green)"/><text x="203" y="129" font-size="13" fill="#677568" font-weight="400" text-anchor="start">请求</text><path d="M447 143H654" fill="none" stroke="#315e50" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#green)"/><text x="521" y="129" font-size="14" fill="#315e50" font-weight="400" text-anchor="start">前提满足</text><path d="M352 194V299" fill="none" stroke="#ac4937" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#red)"/><text x="365" y="251" font-size="14" fill="#ac4937" font-weight="400" text-anchor="start">缺失 / 失效 / 未知</text><path d="M747 194V299" fill="none" stroke="#315e50" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#green)"/><text x="760" y="252" font-size="14" fill="#677568" font-weight="400" text-anchor="start">实际结果</text><path d="M263 349H232V169H259" fill="none" stroke="#315e50" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#green)"/><text x="236" y="285" font-size="13" fill="#677568" font-weight="400" text-anchor="start">重查</text><path d="M118 303V243H220V183H259" fill="none" stroke="#315e50" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#green)"/><text x="31" y="232" font-size="14" fill="#677568" font-weight="400" text-anchor="start">读取当前状态</text><path d="M748 399V444H118V399" fill="none" stroke="#315e50" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#green)"/><text x="424" y="435" font-size="15" fill="#315e50" font-weight="400" text-anchor="middle">新证据 + 已发生成本</text><rect x="28" y="97" width="156" height="97" rx="7" fill="#fffefa" stroke="#d5dbd0" stroke-width="1.4"/><text x="106" y="137" font-size="21" fill="#263c34" font-weight="550" text-anchor="middle">Agent 行动</text><text x="106" y="166" font-size="15" fill="#677568" font-weight="400" text-anchor="middle">声明所需材料</text><rect x="263" y="97" width="184" height="97" rx="7" fill="#fffefa" stroke="#315e50" stroke-width="1.4"/><text x="355" y="137" font-size="22" fill="#263c34" font-weight="550" text-anchor="middle">执行准入</text><text x="355" y="166" font-size="15" fill="#677568" font-weight="400" text-anchor="middle">版本 · 材料 · 预算</text><rect x="658" y="97" width="214" height="97" rx="7" fill="#fffefa" stroke="#d5dbd0" stroke-width="1.4"/><text x="765" y="137" font-size="21" fill="#263c34" font-weight="550" text-anchor="middle">执行工具 / harness</text><text x="765" y="166" font-size="15" fill="#677568" font-weight="400" text-anchor="middle">在受支持边界控制</text><rect x="28" y="303" width="180" height="96" rx="7" fill="#e9eee3" stroke="#315e50" stroke-width="1.4"/><text x="118" y="342" font-size="21" fill="#263c34" font-weight="550" text-anchor="middle">版本化状态图</text><text x="118" y="372" font-size="15" fill="#677568" font-weight="400" text-anchor="middle">依赖 · 证据 · 成本账</text><rect x="263" y="303" width="184" height="96" rx="7" fill="#f7ece5" stroke="#ac4937" stroke-width="1.4"/><text x="355" y="342" font-size="21" fill="#ac4937" font-weight="550" text-anchor="middle">恢复 / 重验</text><text x="355" y="372" font-size="15" fill="#677568" font-weight="400" text-anchor="middle">无可行路径则停止</text><rect x="658" y="303" width="214" height="96" rx="7" fill="#fffefa" stroke="#d5dbd0" stroke-width="1.4"/><text x="765" y="342" font-size="21" fill="#263c34" font-weight="550" text-anchor="middle">验证与记录</text><text x="765" y="372" font-size="15" fill="#677568" font-weight="400" text-anchor="middle">保留成功、失败及代价</text></g></svg>