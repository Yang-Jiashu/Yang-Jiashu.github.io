<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">运行时目标闭环</title><desc id="desc">目标机制，尚非统一验收声明。检查前提后按需准备，再在受支持边界执行验证，提交结果、来源和成本。提交状态回到下一轮检查，失败和重试成本也计入。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#315e50" stroke-width="1.5"/></marker><marker id="changed" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#ac4937" stroke-width="1.5"/></marker></defs>
<rect width="800" height="340" fill="#fcfdfa"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="32" y="40" font-size="20" fill="#263c34" font-weight="600" text-anchor="start">运行时目标闭环</text>
<text x="124" y="114" font-size="20" fill="#263c34" font-weight="600" text-anchor="middle">检查前提</text>
<text x="124" y="148" font-size="16" fill="#68766d" font-weight="400" text-anchor="middle">版本 / 材料 / 预算</text>
<path d="M46 172L202 172" fill="none" stroke="#d7dfd8" stroke-width="1.5"/>
<text x="308" y="114" font-size="20" fill="#263c34" font-weight="600" text-anchor="middle">按需准备</text>
<text x="308" y="148" font-size="16" fill="#68766d" font-weight="400" text-anchor="middle">读取 / 恢复 / 重验</text>
<path d="M230 172L386 172" fill="none" stroke="#d7dfd8" stroke-width="1.5"/>
<text x="492" y="114" font-size="20" fill="#263c34" font-weight="600" text-anchor="middle">执行验证</text>
<text x="492" y="148" font-size="16" fill="#68766d" font-weight="400" text-anchor="middle">受支持的控制边界</text>
<path d="M414 172L570 172" fill="none" stroke="#d7dfd8" stroke-width="1.5"/>
<text x="676" y="114" font-size="20" fill="#263c34" font-weight="600" text-anchor="middle">提交状态</text>
<text x="676" y="148" font-size="16" fill="#68766d" font-weight="400" text-anchor="middle">结果 / 来源 / 成本</text>
<path d="M598 172L754 172" fill="none" stroke="#d7dfd8" stroke-width="1.5"/>
<path d="M202 108H230" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M386 108H414" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M570 108H598" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M676 184V254H124V184" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="400" y="238" font-size="16" fill="#315e50" font-weight="400" text-anchor="middle">新状态进入下一轮</text>
<path d="M32 294L768 294" fill="none" stroke="#d7dfd8" stroke-width="1.5"/>
<text x="400" y="324" font-size="16" fill="#68766d" font-weight="400" text-anchor="middle">失败和重试，也记入完整成本</text>
</g>
</svg>
