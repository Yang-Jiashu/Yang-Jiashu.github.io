<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">AI4AI 目标分工</title><desc id="desc">目标职责示意，并不表示已经实现递归自我改进。Agent提出候选，LongHorizonOS维护运行状态和资源，独立评估器用固定口径检验实际结果并反馈下一轮。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#315e50" stroke-width="1.5"/></marker><marker id="changed" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#ac4937" stroke-width="1.5"/></marker></defs>
<rect width="800" height="340" fill="#fcfdfa"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="32" y="40" font-size="20" fill="#263c34" font-weight="600" text-anchor="start">AI4AI 目标分工</text>
<rect x="44" y="96" width="196" height="104" rx="2" fill="#fcfdfa" stroke="#d7dfd8" stroke-width="1.5"/>
<text x="142" y="137" font-size="20" fill="#263c34" font-weight="600" text-anchor="middle">Agent 候选</text>
<text x="142" y="171" font-size="16" fill="#68766d" font-weight="400" text-anchor="middle">代码 / 策略</text>
<rect x="302" y="96" width="196" height="104" rx="2" fill="#edf3ed" stroke="#315e50" stroke-width="1.5"/>
<text x="400" y="137" font-size="20" fill="#263c34" font-weight="600" text-anchor="middle">LHOS 运行</text>
<text x="400" y="171" font-size="16" fill="#68766d" font-weight="400" text-anchor="middle">版本 / 恢复 / 预算</text>
<rect x="560" y="96" width="196" height="104" rx="2" fill="#fcfdfa" stroke="#d7dfd8" stroke-width="1.5"/>
<text x="658" y="137" font-size="20" fill="#263c34" font-weight="600" text-anchor="middle">独立评估</text>
<text x="658" y="171" font-size="16" fill="#68766d" font-weight="400" text-anchor="middle">固定口径，检验结果</text>
<path d="M240 148H294" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M498 148H552" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M658 212V270H142V212" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="400" y="254" font-size="16" fill="#315e50" font-weight="400" text-anchor="middle">评价反馈下一轮候选</text>
<text x="400" y="320" font-size="16" fill="#68766d" font-weight="400" text-anchor="middle">同预算下，比较经验证的有效进展</text>
</g>
