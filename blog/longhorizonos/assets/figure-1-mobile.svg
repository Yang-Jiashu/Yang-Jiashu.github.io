<text x="162" y="176" font-size="17" fill="#263c34" font-weight="400" text-anchor="middle">T_A</text>
<text x="278" y="176" font-size="17" fill="#ac4937" font-weight="600" text-anchor="middle">待重验</text>
<path d="M94 170H124" fill="none" stroke="#315e50" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M198 170H230" fill="none" stroke="#ac4937" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#changed)"/>
