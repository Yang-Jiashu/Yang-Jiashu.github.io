<svg xmlns="http://www.w3.org/2000/svg" width="360" height="448" viewBox="0 0 360 448" role="img" aria-labelledby="title desc">
<title id="title">历史结论的适用条件</title><desc id="desc">目标机制示意。局部修改f后，相关证据T_A待重验；其他记录保留但仍检查适用性。未知依赖不当成有效，图本身不证明语义正确。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#315e50" stroke-width="1.5"/></marker><marker id="changed" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#ac4937" stroke-width="1.5"/></marker></defs>
<rect width="360" height="448" fill="#fcfdfa"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="24" y="34" font-size="17" fill="#263c34" font-weight="600" text-anchor="start">历史结论的适用条件</text>
